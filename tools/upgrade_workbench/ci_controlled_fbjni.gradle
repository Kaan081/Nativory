import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.attributes.Attribute
import java.security.MessageDigest

// Controlled CI experiment only. No customer app fix is claimed.
gradle.beforeProject { project ->
    if (project.path != ':app') return
    def version = project.findProperty('rnwbFbjniVersion')?.toString()
    def destination = project.findProperty('rnwbEvidencePath')?.toString()
    if (!(version in ['0.6.0', '0.7.0']) || !destination) {
        throw new GradleException('RNWB_INVALID_CONTROLLED_EXPERIMENT_ARGUMENTS')
    }

    project.configurations.configureEach { config ->
        if (config.name == 'debugRuntimeClasspath') {
            config.resolutionStrategy.force("com.facebook.fbjni:fbjni:${version}")
        }
    }

    project.tasks.register('rnwbControlledFbjniAar') {
        doLast {
            def config = project.configurations.getByName('debugRuntimeClasspath')
            def components = config.incoming.resolutionResult.allComponents.findAll { item ->
                def id = item.id
                id instanceof ModuleComponentIdentifier &&
                    id.group == 'com.facebook.fbjni' && id.module == 'fbjni'
            }
            if (components.size() != 1 || components.iterator().next().id.version != version) {
                throw new GradleException('RNWB_CONTROLLED_GRAPH_SELECTION_MISMATCH')
            }

            def view = config.incoming.artifactView {
                componentFilter { id ->
                    id instanceof ModuleComponentIdentifier &&
                        id.group == 'com.facebook.fbjni' && id.module == 'fbjni'
                }
                attributes {
                    attribute(Attribute.of('artifactType', String), 'aar')
                }
            }
            def matches = view.artifacts.artifacts.toList()
            if (matches.size() != 1) {
                throw new GradleException('RNWB_EXPECTED_ONE_AAR:' + matches.size())
            }

            def chosen = matches[0]
            def file = chosen.file
            if (chosen.id.componentIdentifier.version != version ||
                    !file.isFile() || !file.name.toLowerCase().endsWith('.aar')) {
                throw new GradleException('RNWB_SELECTED_FILE_OR_VERSION_MISMATCH')
            }

            def digest = MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] chunk = new byte[65536]
                int count
                while ((count = input.read(chunk)) != -1) digest.update(chunk, 0, count)
            }
            def sha = digest.digest().collect {
                String.format('%02x', it & 255)
            }.join('')

            def record = [
                schema: 'rnwb-controlled-same-app-selection-0.1',
                scope: 'CI_GENERATED_EXPO58_APP_WITH_FORCED_VERSION_NOT_CUSTOMER_FIX',
                configuration: 'debugRuntimeClasspath',
                coordinate: "com.facebook.fbjni:fbjni:${version}",
                forced_version: version,
                resolved_aar_sha256: sha,
                aar_path: file.absolutePath,
                artifact_bytes: file.length(),
                app_fix_accepted: false,
                release_certified: false
            ]

            def out = new File(destination)
            out.parentFile.mkdirs()
            out.text = JsonOutput.prettyPrint(JsonOutput.toJson(record)) + '\n'
            println('RNWB_CONTROLLED_APP_SELECTION_V1:' +
                JsonOutput.toJson(record.findAll { k, v -> k != 'aar_path' }))
        }
    }
}