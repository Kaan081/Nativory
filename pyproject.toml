[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rn-readiness-spike"
version = "0.1.3"
description = "Nativory — Native Upgrade Evidence: read-only React Native Android AGP/Gradle minimum compatibility scanner"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "tomli>=2; python_version < '3.11'"]

[project.scripts]
nativory = "rn_readiness.cli:main"
rn-readiness = "rn_readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rn_readiness = ["knowledge/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
